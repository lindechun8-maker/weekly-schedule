<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17243b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>我的周日程表</title>
  <style>
    :root { --ink:#17243b; --muted:#627089; --line:#dce3ee; --paper:#f7f9fc; --teal:#0dc9c2; --blue:#5268f4; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Microsoft YaHei", system-ui, sans-serif; color:var(--ink); background:#eef2f8; }
    .app { max-width:1500px; margin:auto; padding:28px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:22px; }
    h1 { margin:0; font-size:26px; } .sub { color:var(--muted); margin:6px 0 0; font-size:14px; }
    button { border:0; border-radius:10px; padding:10px 15px; cursor:pointer; font:inherit; font-weight:700; }
    .primary { background:var(--blue); color:#fff; box-shadow:0 6px 15px #5268f444; } .secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .layout { display:grid; grid-template-columns:minmax(700px,1fr) 280px; gap:20px; }
    .calendar, .side { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 25px #2436560b; overflow:hidden; }
    .week { display:grid; grid-template-columns:88px repeat(7,minmax(112px,1fr)); min-width:900px; }
    .calendar { overflow-x:auto; }
    .head { background:#17243b; color:#fff; text-align:center; padding:13px 4px; font-weight:700; position:sticky; top:0; z-index:3; }
    .time { min-height:66px; background:#e8fbfb; color:#107b80; padding:11px 10px; border-right:1px solid #cde8e8; border-bottom:1px solid var(--line); font-weight:700; font-size:13px; }
    .cell { min-height:66px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px; background:linear-gradient(135deg,#fff 0%,#fbfcff 100%); position:relative; }
    .cell.empty:hover { background:#f0f4ff; cursor:pointer; } .cell.empty:hover::after { content:"＋ 添加"; color:#7180a6; font-size:12px; position:absolute; inset:22px 0; text-align:center; }
    .event { height:calc(100% - 8px); min-height:58px; padding:8px; border-radius:8px; color:#fff; overflow:hidden; cursor:pointer; position:relative; z-index:2; box-shadow:0 3px 8px #00000016; }
    .event strong { display:block; font-size:14px; } .event span { display:block; font-size:12px; line-height:1.45; margin-top:3px; opacity:.92; }
    .event.class { background:linear-gradient(135deg,#f7a814,#ee7c18); } .event.task { background:linear-gradient(135deg,#5268f4,#8a5cf6); } .event.personal { background:linear-gradient(135deg,#12aaa3,#1bbd7d); }
    .side { padding:18px; } .side h2 { font-size:16px; margin:0 0 12px; } .side p { color:var(--muted); font-size:13px; line-height:1.55; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; margin:17px 0 22px; font-size:12px; color:var(--muted); }.dot { width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px; }.list { border-top:1px solid var(--line); }.item { padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer; }.item b,.item small { display:block; }.item small { margin-top:4px; color:var(--muted); }
    dialog { border:0; border-radius:16px; width:min(480px,calc(100% - 28px)); padding:0; box-shadow:0 24px 70px #17243b55; } dialog::backdrop { background:#17243b88; }.modal { padding:22px; }.modal h2 { margin:0 0 18px; font-size:20px; }.field { margin:12px 0; }.field label { display:block;font-size:13px;font-weight:700;margin-bottom:6px; } input,select,textarea { width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit; } textarea { min-height:70px;resize:vertical; }.twocol { display:grid;grid-template-columns:1fr 1fr;gap:10px; }.actions { display:flex; justify-content:space-between; gap:8px; margin-top:20px; }.actions div { display:flex; gap:8px; }.danger { color:#cf3756;background:#fff0f3; }.hidden { display:none; }
    .mobile-panel,.mobile-add { display:none; }
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.app{padding:16px} header{align-items:flex-start}.week{min-width:850px}.mobile-panel{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:16px}.mobile-panel h2{font-size:16px;margin:0 0 8px}.mobile-panel p{font-size:13px;color:var(--muted);margin:0 0 10px}.calendar{border-radius:14px}.time{position:sticky;left:0;z-index:2}.head:first-child{position:sticky;left:0;z-index:4}}
    @media(max-width:560px){.app{padding:13px}h1{font-size:22px}.sub{font-size:12px;line-height:1.45}.week{min-width:760px;grid-template-columns:75px repeat(7,98px)}.head{font-size:13px;padding:11px 3px}.time{min-height:62px;padding:9px 6px;font-size:12px}.cell{min-height:62px}.event{padding:6px}.event strong{font-size:13px}.event span{font-size:11px}.mobile-add{display:block;position:fixed;right:18px;bottom:20px;z-index:10;border-radius:99px;padding:14px 18px}.app header .primary{display:none}}
    /* 手机专用周总览 */
    .layout,.mobile-panel,.mobile-add { display:none !important; }
    .app { max-width:560px; padding:16px 12px 28px; }
    header { align-items:flex-start; margin-bottom:14px; }
    header h1 { font-size:23px; } header .sub { font-size:12px; line-height:1.4; }
    .phone-week { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; width:100%; }
    .day-card { min-height:300px; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
    .day-name { border:0; border-radius:0; padding:8px 2px; background:#17243b; color:#fff; font-size:11px; font-weight:700; }
    .day-events { padding:4px 3px; flex:1; display:flex; flex-direction:column; gap:4px; }
    .mini-event { border:0; border-radius:6px; padding:5px 2px; text-align:left; color:#fff; font-size:9px; line-height:1.25; overflow:hidden; word-break:break-word; }
    .mini-event.class { background:#ed8b17; }.mini-event.task { background:#5268f4; }.mini-event.personal { background:#18a88a; }
    .mini-time { display:block; opacity:.85; font-size:8px; margin-bottom:2px; }
    .day-add { border:0; border-top:1px dashed var(--line); border-radius:0; background:#fff; color:#7180a6; padding:7px 0; font-size:13px; }
    .week-reset { width:100%; margin-top:12px; background:#fff0f3; color:#bd3151; border:1px solid #f2c7d1; }
    @media(max-width:360px){.app{padding:10px 6px}.day-card{min-height:280px}.day-name{font-size:10px}.mini-event{font-size:8px;padding:4px 1px}}
    /* 详细横向周课表：手机手势左右滑动，时间与星期固定。 */
    .phone-week,.week-reset,.mobile-panel,.mobile-add { display:none !important; }
    .app { max-width:none; padding:12px; }
    .layout { display:block !important; }
    .side { display:none !important; }
    .calendar { display:block; width:100%; border-radius:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .week { grid-template-columns:72px repeat(7,96px); min-width:744px; }
    .head { font-size:13px; padding:11px 2px; }
    .head:first-child { position:sticky; left:0; z-index:5; }
    .time { min-height:62px; padding:8px 6px; font-size:12px; position:sticky; left:0; z-index:2; }
    .cell { min-height:62px; }.event { padding:6px; }.event strong { font-size:13px; }.event span { font-size:11px; }
    .top-actions { display:flex; gap:8px; align-items:center; }.top-actions button { padding:9px 11px; font-size:13px; white-space:nowrap; }
    .top-reset { background:#fff0f3; color:#bd3151; border:1px solid #f2c7d1; }
    @media(max-width:380px){.app{padding:8px}.week{grid-template-columns:66px repeat(7,88px);min-width:682px}.top-actions{gap:5px}.top-actions button{padding:8px 7px;font-size:12px}header h1{font-size:20px}}
    .todos { margin-top:20px; padding:18px; background:#fff; border:1px solid var(--line); border-radius:16px; }
    .todo-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .todo-heading h2 { margin:0; font-size:20px; }
    #todoCount { color:var(--muted); font-size:13px; }
    .todo-intro,.todo-footnote { color:var(--muted); font-size:13px; line-height:1.6; }
    .todo-add { display:flex; gap:8px; margin:16px 0; }
    .todo-add input { min-width:0; flex:1; font-size:16px; }
    .todo-add button { flex-shrink:0; }
    .todos h3 { font-size:13px; color:var(--muted); margin:22px 0 4px; }
    .todo-row { display:flex; align-items:flex-start; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
    .todo-check { display:flex; align-items:center; justify-content:center; width:44px; min-height:44px; flex-shrink:0; cursor:pointer; }
    .todo-check input { width:22px; height:22px; margin:0; accent-color:var(--blue); }
    .todo-content { flex:1; min-width:0; }
    .todo-title { display:block; width:100%; text-align:left; padding:10px 0 6px; min-height:44px; background:none; font-size:16px; color:var(--ink); overflow-wrap:anywhere; }
    .todo-note { font-size:13px; color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; margin:2px 0 6px; }
    .todo-time { display:block; background:#eef1ff; color:#4054c8; text-align:left; font-size:12px; line-height:1.5; min-height:44px; padding:7px 9px; margin-top:4px; }
    .todo-status { display:block; font-size:12px; color:var(--muted); padding-bottom:4px; }
    .todo-plan { min-height:44px; padding:10px; font-size:14px; flex-shrink:0; }
    .todo-row.is-done .todo-title { text-decoration:line-through; color:var(--muted); }
    .event.is-done { opacity:.65; }
    .event { display:block; width:100%; text-align:left; font-weight:400; }
    .event strong,.event span { overflow-wrap:anywhere; }
    .todo-empty { padding:18px 0; color:var(--muted); font-size:14px; text-align:center; }
    #completedGroup { margin-top:18px; }
    #completedLabel { cursor:pointer; min-height:44px; padding:12px 0; color:var(--muted); font-size:14px; }
    .todo-footnote { margin:18px 0 0; font-size:12px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    [hidden] { display:none !important; }
    button:focus-visible,.cell:focus-visible,input:focus-visible { outline:3px solid #5268f4; outline-offset:2px; }
    dialog { max-height:calc(100dvh - 28px); overflow:auto; }
    @media(max-width:560px) {
      header { flex-wrap:wrap; gap:12px; }
      .app header .primary { display:inline-block; }
      .top-actions { width:100%; justify-content:flex-end; }
      .top-actions button { min-height:44px; }
      .todos { padding:14px 10px; }
      .modal { padding:18px; }
      .modal input,.modal select,.modal textarea { font-size:16px; }
      .actions button { min-height:44px; padding:10px; }
    }

</style>
</head>
<body>
  <main class="app">
    <header><div><h1>我的周日程表</h1><p class="sub">完整周课表 · 左右滑动查看每天，点空格新增，点事项编辑。</p></div><div class="top-actions"><button class="top-reset" id="resetTop">恢复学校课程</button><button class="primary" id="addBtn">＋ 新增</button></div></header>
<section class="phone-week" id="phoneWeek"></section><button class="week-reset" id="weekReset">恢复学校原始课程</button>
    <section class="layout"><div class="calendar"><div class="week" id="calendar"></div></div><aside class="side"><h2>本周安排</h2><p>以课表为基础，安排学习、活动与待办。</p><div class="legend"><span><i class="dot" style="background:#f29217"></i>课程</span><span><i class="dot" style="background:#6170f4"></i>任务</span><span><i class="dot" style="background:#16ad91"></i>个人</span></div><div class="list" id="eventList"></div><button class="secondary" id="resetBtn" style="width:100%;margin-top:16px">恢复学校原始课程</button></aside></section>
    <section class="mobile-panel"><h2>全部安排</h2><p>点选事项可编辑；周视图可左右滑动。</p><div class="list" id="mobileList"></div><button class="secondary" id="mobileReset" style="width:100%;margin-top:16px">恢复学校原始课程</button></section><button class="primary mobile-add" id="mobileAdd">＋ 新增</button>
    <section class="todos" aria-labelledby="todoHeading">
      <div class="todo-heading"><h2 id="todoHeading">待办清单</h2><span id="todoCount" aria-live="polite"></span></div>
      <p class="todo-intro">先记下要做的事，再安排进日程。点名称可编辑。</p>
      <form id="todoAddForm" class="todo-add"><label class="sr-only" for="todoInput">新增待办</label><input id="todoInput" required maxlength="120" placeholder="有什么事情要做？" autocomplete="off"><button type="submit" class="primary">＋ 添加</button></form>
      <p id="todoEmpty" class="todo-empty">还没有待办，先记下一件想做的事吧。</p>
      <section id="unscheduledGroup"><h3>未安排</h3><div id="unscheduledList"></div></section>
      <section id="scheduledGroup"><h3>已安排</h3><div id="scheduledList"></div></section>
      <details id="completedGroup"><summary id="completedLabel">已完成</summary><div id="completedList"></div></details>
      <p class="todo-footnote">自动保存在当前浏览器 · 恢复学校课程时保留待办</p>
    </section>

  </main>
  <dialog id="editor"><form class="modal" id="form"><h2 id="modalTitle">新增安排</h2><p id="linkedHint" class="todo-intro" hidden>名称和备注会同步到待办；取消安排后待办仍保留。</p><input type="hidden" id="eventId"><div class="field"><label>事项名称</label><input id="title" required placeholder="例如：完成英语作业"></div><div class="twocol"><div class="field"><label>星期</label><select id="day"></select></div><div class="field"><label>类型</label><select id="type"><option value="task">任务</option><option value="personal">个人</option><option value="class">课程</option></select></div></div><div class="twocol"><div class="field"><label>开始时间</label><select id="start"></select></div><div class="field"><label>结束时间</label><select id="end"></select></div></div><div class="field"><label>地点／备注（可选）</label><textarea id="note" placeholder="例如：图书馆 3 楼"></textarea></div><div class="actions"><button class="danger hidden" type="button" id="deleteBtn">删除</button><span></span><div><button class="secondary" type="button" id="cancelBtn">取消</button><button class="primary" type="submit">保存</button></div></div></form></dialog>
  <dialog id="todoEditor"><form class="modal" id="todoEditForm"><h2>编辑待办</h2><input type="hidden" id="todoEditId"><div class="field"><label for="todoEditTitle">待办名称</label><input id="todoEditTitle" required maxlength="120"></div><div class="field"><label for="todoEditNote">备注（可选）</label><textarea id="todoEditNote"></textarea></div><p class="todo-intro">已安排的待办，名称与备注会同时更新到日程。</p><div class="actions"><button type="button" class="danger" id="todoDelete">删除</button><div><button type="button" class="secondary" id="todoEditCancel">取消</button><button class="primary" type="submit">保存</button></div></div></form></dialog>

  <script src="./app.js"></script>
</body>
</html>
